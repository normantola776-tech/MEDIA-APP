<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14081c" />
      <stop offset="50%" stop-color="#080808" />
      <stop offset="100%" stop-color="#180a22" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#FF2D75" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#starGrad)" stroke-width="4" stroke-opacity="0.35" />
  
  <!-- Glowing 4-point star & spark -->
  <g filter="url(#glow)">
    <path d="M256 64 C256 160 270 240 384 256 C270 272 256 352 256 448 C256 352 242 272 128 256 C242 240 256 160 256 64 Z" fill="url(#starGrad)" />
  </g>
  
  <!-- Center Play Accent -->
  <polygon points="244,228 284,256 244,284" fill="#FFFFFF" opacity="0.95" />
</svg>
